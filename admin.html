<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบหลังบ้าน | BW Training Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/img/logo.png" type="image/png">
<link rel="stylesheet" href="assets/css/style.css?v=202608191815">
<style>
  body{background:var(--paper)}
  .admin-top{background:var(--blue-deep);color:#fff;padding:14px 0}
  .admin-top .container{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .admin-top img{width:40px}
  .admin-top h1{font-family:var(--head-en);font-weight:900;font-size:1.1rem;margin:0;letter-spacing:.05em}
  .admin-top .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .abtn{padding:9px 16px;border-radius:10px;font-size:.85rem;font-weight:500;background:rgba(255,255,255,.14);color:#fff}
  .abtn:hover{background:rgba(255,255,255,.26)}
  .abtn.y{background:var(--yellow);color:var(--ink)}
  .abtn.r{background:#e04848}
  .layout{display:grid;grid-template-columns:230px 1fr;gap:22px;padding:22px 0 60px}
  .side{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;height:max-content;position:sticky;top:16px}
  .side button{display:block;width:100%;text-align:left;background:none;padding:11px 14px;border-radius:10px;font-size:.9rem;color:var(--ink)}
  .side button:hover{background:var(--paper)}
  .side button.on{background:var(--blue);color:#fff;font-weight:500}
  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;display:none}
  .panel.on{display:block}
  .panel h2{font-family:var(--head-en);font-weight:900;color:var(--blue);font-size:1.2rem;margin-bottom:4px}
  .panel .hint{color:var(--muted);font-size:.85rem;margin:0 0 18px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .row.one{grid-template-columns:1fr}
  .item{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:var(--paper);position:relative}
  .item .del{position:absolute;right:10px;top:10px;background:#fee;color:#c33;border-radius:8px;padding:4px 10px;font-size:.78rem}
  .item .idx{font-family:var(--head-en);font-weight:900;color:var(--blue);font-size:.8rem;margin-bottom:8px}
  .addbtn{background:var(--blue);color:#fff;padding:10px 18px;border-radius:10px;font-size:.87rem}
  .lead-tb{width:100%;border-collapse:collapse;font-size:.85rem}
  .lead-tb th,.lead-tb td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  .lead-tb th{background:var(--paper);white-space:nowrap}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,120%);background:#146c3a;color:#fff;padding:12px 24px;border-radius:12px;z-index:2000;transition:.35s;font-size:.9rem}
  .toast.on{transform:translate(-50%,0)}
  .login{max-width:400px;margin:80px auto;background:#fff;border-radius:20px;padding:32px;box-shadow:var(--shadow-lg);text-align:center}
  @media(max-width:820px){.layout{grid-template-columns:1fr}.side{position:static}.row{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ล็อกอิน (ป้องกันเบื้องต้นฝั่งหน้าเว็บ — ควรใช้รหัสผ่านระดับโฮสติ้งเพิ่มเมื่อขึ้นเซิร์ฟเวอร์จริง) -->
<div id="login" class="login">
  <img src="assets/img/logo.png" width="72" style="margin:0 auto 14px">
  <h2 style="font-family:var(--head-en);color:var(--blue);font-weight:900">BW TRAINING ADMIN</h2>
  <p style="color:var(--muted);font-size:.88rem">เข้าสู่ระบบหลังบ้านเพื่อแก้ไขเนื้อหาเว็บไซต์</p>
  <input type="password" id="pw" placeholder="รหัสผ่าน" style="text-align:center;margin-bottom:12px">
  <button class="btn btn-blue" id="loginBtn" style="width:100%;justify-content:center">เข้าสู่ระบบ</button>
  <p style="color:var(--muted);font-size:.78rem;margin-top:14px">รหัสผ่านเริ่มต้น: <b>bwtraining2026</b> (เปลี่ยนได้ในแท็บ “ตั้งค่า”)</p>
  <p style="color:var(--muted);font-size:.78rem;margin-top:10px;border-top:1px solid var(--line);padding-top:12px">
    หรือแก้ไขง่ายๆ ที่หน้าเว็บโดยตรง → <a href="index.html?edit=1" style="color:var(--blue);font-weight:600">✏️ เปิดโหมดแก้ไขหน้าเว็บ</a></p>
</div>

<div id="app" style="display:none">
<div class="admin-top">
  <div class="container">
    <img src="assets/img/logo.png" alt="">
    <h1>BW TRAINING — ADMIN PANEL</h1>
    <div class="sp">
      <a class="abtn y" href="index.html?edit=1" target="_blank">✏️ แก้ไขที่หน้าเว็บ</a>
      <a class="abtn" href="index.html" target="_blank">👁 ดูเว็บไซต์</a>
      <button class="abtn" id="exportBtn">⬇ ส่งออก JSON</button>
      <button class="abtn" id="importBtn">⬆ นำเข้า JSON</button>
      <button class="abtn r" id="resetBtn">↺ คืนค่าเริ่มต้น</button>
      <button class="abtn y" id="saveBtn">💾 บันทึกทั้งหมด</button>
    </div>
  </div>
</div>

<div class="container layout">
  <nav class="side" id="side"></nav>
  <div>
    <div class="panel" id="p-company"></div>
    <div class="panel" id="p-hero"></div>
    <div class="panel" id="p-stats"></div>
    <div class="panel" id="p-expertise"></div>
    <div class="panel" id="p-intro"></div>
    <div class="panel" id="p-services"></div>
    <div class="panel" id="p-portfolio"></div>
    <div class="panel" id="p-clients"></div>
    <div class="panel" id="p-testimonials"></div>
    <div class="panel" id="p-blog"></div>
    <div class="panel" id="p-faq"></div>
    <div class="panel" id="p-about"></div>
    <div class="panel" id="p-seo"></div>
    <div class="panel" id="p-leads"></div>
    <div class="panel" id="p-settings"></div>
  </div>
</div>
</div>

<input type="file" id="fileIn" accept="application/json" hidden>
<div class="toast" id="toast"></div>

<script src="assets/js/supabase.js?v=202608191815"></script>
<script src="assets/js/data.js?v=202608191815"></script>
<script src="assets/js/cropper.js?v=202608191815"></script>
<script src="assets/js/admin.js?v=202608191815"></script>
</body>
</html>
