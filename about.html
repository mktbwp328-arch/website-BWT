<section class="page-hero">
  <div class="container">
    <h1 id="abHeroEn"></h1>
    <div class="th" id="abHeroTh"></div>
    <div class="crumb"><a href="index.html">หน้าแรก</a> / เกี่ยวกับเรา</div>

<section>
  <div class="container grid-2" style="gap:44px;align-items:center">
    <div class="g1 reveal" id="abImg" data-edit-bg="about.img"
         style="min-height:400px;border-radius:24px;background-size:cover;background-position:center"></div>
    <div>
      <div class="section-kicker" id="abKicker" data-edit="about.kicker"></div>

      <p class="lead" id="aboutBody" data-edit="about.body"></p>
      <ul class="check-list" id="aboutPoints" style="margin-top:20px"></ul>
      <div class="pill-row" id="abPills"></div>
    </div>
  </div>
</section>

<section class="sec-paper">
  <div class="container">
    <div class="sec-head center">
      <div class="section-kicker" id="abTlKicker" data-edit="about.timelineKicker"></div>

    </div>
  </div>
</section>

<script>
window.pageInit = function (R, S) {
  const a = S.about, q = id => document.getElementById(id);
  const put = (id, v) => { const el = q(id); if (el) el.textContent = v || ""; };

  R.stats("#statGrid"); R.testimonials("#tstGrid");

  put("abHeroEn", a.heroEn); put("abHeroTh", a.heroTh);
  put("abKicker", a.kicker); put("aboutHead", a.headline); put("aboutBody", a.body);
  put("abTlKicker", a.timelineKicker); put("abTlTitle", a.timelineTitle);
  put("abValKicker", a.valuesKicker); put("abValTitle", a.valuesTitle);
  put("abRvKicker", a.reviewKicker); put("abRvTitle", a.reviewTitle);
  put("abCtaTitle", a.ctaTitle); put("abCtaDesc", a.ctaDesc); put("abCtaBtn", a.ctaBtn);

  if (q("abImg") && a.img) q("abImg").style.backgroundImage = `url('${a.img}')`;

  q("aboutPoints").innerHTML = a.points.map((p, i) =>
    `<li><span class="tick">✓</span><span data-edit="about.points.${i}">${p}</span></li>`).join("");

  q("abPills").innerHTML = (a.pills || []).map((p, i) =>
    `<span class="pill"><span data-edit="about.pills.${i}.ico">${p.ico}</span>
      <span data-edit="about.pills.${i}.text">${p.text}</span></span>`).join("");

  q("timeline").innerHTML = a.timeline.map((t, i) => `
    <div class="svc reveal" style="padding:24px">
      <div class="price" style="font-size:2rem" data-edit="about.timeline.${i}.y">${t.y}</div>
      <h3 style="margin:6px 0 6px;font-size:1rem" data-edit="about.timeline.${i}.t">${t.t}</h3>
      <p style="color:var(--muted);font-size:.88rem;margin:0" data-edit="about.timeline.${i}.d">${t.d}</p>
    </div>`).join("");

  q("abValues").innerHTML = (a.values || []).map((v, i) => `
    <div class="prog reveal" style="padding:28px">
      <div style="font-size:2rem" data-edit="about.values.${i}.ico">${v.ico}</div>
      <h3 style="color:var(--blue);font-family:var(--head-en);font-weight:900"
          data-edit="about.values.${i}.title">${v.title}</h3>
      <p style="color:var(--muted);margin:0" data-edit="about.values.${i}.desc">${v.desc}</p>
    </div>`).join("");
};
</script>
